name: Test render

# Renders one real fight in local mode (nothing is uploaded to the app) on
# every PR, so a change to the recorder or the cut is checked against the
# live page before it runs for real.
#
# The fight comes from the dispatch input or the repository variable
# TEST_MATCH_ID (Settings, Secrets and variables, Actions, Variables), never
# from this file: the repo is public. Without either, only the unit tests run.
# Titles are read from the recorded page. Artifacts of a public repo are
# public, so they are kept for one day only.
on:
  pull_request:
  workflow_dispatch:
    inputs:
      match:
        description: Match id
        required: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MATCH: ${{ inputs.match || vars.TEST_MATCH_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Chromium and ffmpeg
        if: env.MATCH != ''
        run: |
          npx playwright install --with-deps chromium
          sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Render
        if: env.MATCH != ''
        run: node render.mjs --match "$MATCH"
      - name: Contact sheets
        if: env.MATCH != ''
        run: |
          cd "out/$MATCH"
          for f in 16x9 9x16; do
            ffprobe -v error -show_entries format=duration,size:stream=width,height,r_frame_rate -of compact "$f.mp4"
            ffmpeg -v error -y -i "$f.mp4" -vf "fps=1,scale=480:-1,tile=6x5" -frames:v 1 "$f-sheet.png"
          done
          ffmpeg -v error -y -sseof -0.5 -i 16x9.mp4 -frames:v 1 16x9-last.png
          ffmpeg -v error -y -ss 0.1 -i 9x16.mp4 -frames:v 1 9x16-first.png
          ffmpeg -v error -y -sseof -0.5 -i 9x16.mp4 -frames:v 1 9x16-last.png
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: env.MATCH != ''
        with:
          name: render-${{ env.MATCH }}
          path: |
            out/
            !out/*/rec
          retention-days: 1
